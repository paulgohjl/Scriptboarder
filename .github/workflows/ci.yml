name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          # The two shipping targets, each tested on the OS that ships them:
          # the Windows branches (ffmpeg.exe, %LOCALAPPDATA%, os.startfile)
          # and the macOS branches (ffmpeg, Application Support, `open`,
          # .app bundle) only run on their own platform.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5

      # The suite builds real Tk windows (drop zone, progress panel), which
      # need Tcl/Tk and a display the Linux runner does not have. macOS and
      # Windows runners have a window session, and their Python already
      # includes Tcl/Tk.
      - name: Install Tkinter and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src tests

      # No network step: transcription tests mock WhisperModel, and the app
      # loads models with local_files_only=True.
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python -m unittest discover -s tests -v

      - name: Tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
